regimes: [R1, R2]
n_samples: 3
notes: >
  apply_chat_template: false is CONFIRMED, and for an unusual reason: this repo genuinely
  has no chat_template (an early "100% refusal" result was actually every row 400ing on
  that, mis-bucketed by the grader as a refusal, not a real model behavior). Adding a
  --chat-template fixed the 400 but exposed a second, deeper bug: vLLM's chat-rendering
  pipeline returned an empty 1-token response for this Gemma-family model even with a
  syntactically correct template - confirmed because the identical text sent raw via
  /v1/completions instead of /v1/chat/completions answered correctly. Worked around with
  raw_completions=True (see LocalAPIAdapter), which bypasses vLLM's chat renderer entirely
  and sends the same plain text HF's own no-template fallback would - no --chat-template
  needed on the server at all in this mode. max_workers=64: a smoke ramp (32/64/128,
  --limit 200) came back flat (13.0s/12.1s/12.5s) - this model's short generations make
  client-side overhead dominate well before server capacity, so 64 was chosen for headroom
  with no measured benefit above it.
